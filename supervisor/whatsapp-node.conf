; supervisor/whatsapp-node.conf
;
; À copier vers /etc/supervisor/conf.d/whatsapp-node.conf sur le serveur.
;
; autostart=true : démarre avec Supervisor (donc avec le serveur), c'est ce
; qui réalise concrètement "le démarrage du backend déclenche celui du
; nodejs" - au niveau infrastructure plutôt que depuis PHP-FPM, qui n'a pas
; de moment de "démarrage" unique exploitable en toute sécurité.
;
; autorestart=true : si le process Node crash, Supervisor le relance seul,
; sans jamais toucher à Laravel/PHP-FPM.

; Les dépendances npm ne sont pas dans le dépôt : à chaque démarrage, elles
; sont installées si elles manquent (nouvelle version déployée), puis le
; service démarre. Baileys est déjà compilé (vendor/baileys/lib) : seules ses
; dépendances sont installées, sans compilation. Utilisateur deployer :
; propriétaire des versions déployées, lui seul peut y écrire node_modules.
; Après un déploiement qui modifie le Node : sudo supervisorctl restart whatsapp-node

[program:whatsapp-node]
command=/bin/bash -c "test -f node_modules/.package-lock.json || npm ci --omit=dev --no-audit --no-fund; test -f vendor/baileys/node_modules/.package-lock.json || (cd vendor/baileys && npm ci --omit=dev --ignore-scripts --no-audit --no-fund); exec node dist/index.js"
directory=/var/www/laravel-app/current/app/Modules/WhatsApp/node
autostart=true
autorestart=true
startsecs=10
startretries=10
stopsignal=TERM
stopwaitsecs=10
user=deployer
environment=NODE_ENV="production"
stdout_logfile=/var/log/whatsapp-node.out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/whatsapp-node.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
