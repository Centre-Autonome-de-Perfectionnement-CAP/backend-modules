; supervisor/whatsapp-node.conf
;
; À copier vers /etc/supervisor/conf.d/whatsapp-node.conf sur le serveur.
;
; autostart=true : démarre avec Supervisor (donc avec le serveur), c'est ce
; qui réalise concrètement "le démarrage du backend déclenche celui du
; nodejs" — au niveau infrastructure plutôt que depuis PHP-FPM, qui n'a pas
; de moment de "démarrage" unique exploitable en toute sécurité.
;
; autorestart=true : si le process Node crash, Supervisor le relance seul,
; sans jamais toucher à Laravel/PHP-FPM.

[program:whatsapp-node]
command=node dist/index.js
directory=/var/www/laravel-app/current/app/Modules/WhatsApp/node
autostart=true
autorestart=true
startsecs=3
startretries=10
stopsignal=TERM
stopwaitsecs=10
user=www-data
environment=NODE_ENV="production"
stdout_logfile=/var/log/whatsapp-node.out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/whatsapp-node.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
