; supervisor/laravel-worker.conf
;
; À copier vers /etc/supervisor/conf.d/laravel-worker.conf sur le serveur,
; puis : sudo supervisorctl reread && sudo supervisorctl update
;
; 3 workers en parallèle : un envoi WhatsApp avec fichier (jusqu'à 60 s)
; ne retarde jamais les autres notifications.
; --queue=default,emails : le transactionnel passe avant les diffusions.

[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/laravel-app/current/artisan queue:work --queue=default,emails --sleep=1 --tries=3 --timeout=85 --max-time=3600 --memory=256
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=90
user=www-data
numprocs=3
redirect_stderr=true
stdout_logfile=/var/log/laravel-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
