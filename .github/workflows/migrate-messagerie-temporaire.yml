# TEMPORAIRE - à supprimer une fois ces migrations passées en production.
# Après chaque déploiement de main (ou à la demande), passe UNIQUEMENT les
# migrations listées ci-dessous (--path) : aucune autre migration en
# attente n'est touchée. Sans effet sur celles déjà passées.
name: Migration temporaire - module Stages

on:
  workflow_run:
    workflows: ["Deploy to VPS"]
    types: [completed]
  workflow_dispatch:

jobs:
  migrate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Migration de la messagerie
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          ssh $SSH_USER@$SSH_HOST << 'ENDSSH'
            set -e
            cd /var/www/laravel-app/current
            for MIGRATION in \
              app/Modules/Stages/database/migrations/2026_11_05_000000_create_stage_chat_tables.php \
              app/Modules/Stages/database/migrations/2026_11_06_000000_extend_stage_chat_tables.php \
              app/Modules/Stages/database/migrations/2026_11_06_000001_add_stage_report_pairing.php; do
              if [ ! -f "$MIGRATION" ]; then
                echo "Absente de la version déployée : $MIGRATION"
                continue
              fi
              php artisan migrate --force --path="$MIGRATION" --no-interaction
              php artisan migrate:status --path="$MIGRATION" --no-ansi
            done
          ENDSSH
