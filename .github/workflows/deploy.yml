name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          ssh $SSH_USER@$SSH_HOST << 'ENDSSH'
            set -e
            
            # Variables
            DEPLOY_PATH="/var/www/laravel-app"
            REPO_URL="git@github.com:Centre-Autonome-de-Perfectionnement-CAP/backend-modules.git"
            BRANCH="main"
            RELEASE_DIR="$DEPLOY_PATH/releases/$(date +%Y%m%d%H%M%S)"
            SHARED_DIR="$DEPLOY_PATH/shared"
            CURRENT_DIR="$DEPLOY_PATH/current"
            
            echo "🚀 Starting deployment..."
            
            # Create release directory
            mkdir -p $RELEASE_DIR
            
            # Clone repository
            echo "📦 Cloning repository..."
            git clone --depth 1 --branch $BRANCH $REPO_URL $RELEASE_DIR
            
            # Navigate to release directory
            cd $RELEASE_DIR
            
            # Install Composer dependencies
            echo "📚 Installing Composer dependencies..."
            composer install --no-dev --optimize-autoloader --no-interaction

            # ── WhatsApp Node : dépendances ───────────────────────────────────
            # dist/ et Baileys (vendor/baileys/lib) sont déjà compilés dans le
            # dépôt : seules les dépendances sont installées. Un échec ici ne
            # bloque pas le déploiement de Laravel.
            NODE_DIR="$RELEASE_DIR/app/Modules/WhatsApp/node"
            if [ -d "$NODE_DIR" ] && command -v npm &> /dev/null; then
              echo "📦 Installing WhatsApp Node dependencies..."
              (cd "$NODE_DIR" && npm ci --omit=dev --no-audit --no-fund) || echo "⚠️  npm ci (Node) en échec - non bloquant"
              (cd "$NODE_DIR/vendor/baileys" && npm ci --omit=dev --ignore-scripts --no-audit --no-fund) || echo "⚠️  npm ci (Baileys) en échec - non bloquant"
            else
              echo "⚠️  Node/npm introuvable : service WhatsApp non préparé"
            fi
            
            # Sync persistent assets to shared storage before symlinking
            echo "📁 Syncing assets to shared storage..."
            mkdir -p $SHARED_DIR/storage/images
            mkdir -p $SHARED_DIR/storage/fonts
            cp -rn $RELEASE_DIR/storage/images/* $SHARED_DIR/storage/images/ 2>/dev/null || cp -r $RELEASE_DIR/storage/images/* $SHARED_DIR/storage/images/ 2>/dev/null || true
            cp -rn $RELEASE_DIR/storage/fonts/* $SHARED_DIR/storage/fonts/ 2>/dev/null || cp -r $RELEASE_DIR/storage/fonts/* $SHARED_DIR/storage/fonts/ 2>/dev/null || true

            # Create symlinks to shared directories
            echo "🔗 Creating symlinks..."
            rm -rf $RELEASE_DIR/storage
            ln -nfs $SHARED_DIR/storage $RELEASE_DIR/storage
            
            rm -f $RELEASE_DIR/.env
            ln -nfs $SHARED_DIR/.env $RELEASE_DIR/.env

            # Symlink public/storage → shared storage/app/public
            # (php artisan storage:link ne fonctionne pas quand storage/ est
            # déjà un symlink externe - on crée le lien manuellement)
            echo "🔗 Creating public/storage symlink..."
            rm -rf $RELEASE_DIR/public/storage
            ln -nfs $SHARED_DIR/storage/app/public $RELEASE_DIR/public/storage
            
            # Set permissions
            echo "🔐 Setting permissions..."
            chown -R deployer:www-data $RELEASE_DIR
            chmod -R 755 $RELEASE_DIR
            chmod -R 775 $RELEASE_DIR/bootstrap/cache
            
            # Generate APP_KEY if not set
            if ! grep -q "APP_KEY=base64:" $SHARED_DIR/.env; then
              echo "🔑 Generating application key..."
              php artisan key:generate --force
            fi
            
            # Run migrations
            echo "🗄️  Running migrations..."
            #php artisan migrate --force
            
            # Clear and cache config
            echo "🧹 Clearing caches..."
            php artisan config:clear
            php artisan cache:clear || echo "⚠️  Cache clear failed, continuing..."
            php artisan route:clear
            php artisan view:clear
            
            echo "⚡ Optimizing..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache || echo "⚠️  View cache failed, continuing..."
            
            # Update current symlink
            echo "🔄 Updating current release..."
            ln -nfs $RELEASE_DIR $CURRENT_DIR
            
            # Restart PHP-FPM
            echo "♻️  Restarting PHP-FPM..."
            sudo systemctl reload php8.4-fpm
            
            # Le serveur de test tourne sur la même machine : on ne touche
            # qu'aux processus de CE déploiement (dossier sous $DEPLOY_PATH).
            own_pids() {
              for p in $(pgrep -f "$1" || true); do
                case "$(readlink -f /proc/$p/cwd 2>/dev/null)" in "$DEPLOY_PATH"/*) echo "$p" ;; esac
              done
            }

            # Restart queue workers (ils terminent leur job en cours)
            php artisan queue:restart || true
            if command -v supervisorctl &> /dev/null && sudo supervisorctl status "laravel-app-worker:*" &> /dev/null; then
              echo "👷 Restarting queue workers..."
              sudo supervisorctl restart "laravel-app-worker:*" || true
            else
              echo "⚠️  Supervisor non configuré : 3 workers auto-relancés en arrière-plan..."
              kill $(own_pids "queue-worker-loop.sh") 2>/dev/null || true
              kill $(own_pids "artisan queue:work") 2>/dev/null || true
              sleep 1
              chmod +x "$RELEASE_DIR/scripts/queue-worker-loop.sh"
              for i in 1 2 3; do
                nohup setsid "$RELEASE_DIR/scripts/queue-worker-loop.sh" "$CURRENT_DIR" < /dev/null > /dev/null 2>&1 &
              done
            fi

            # Planificateur Laravel (relances, rappels, file d'attente) : ajouté une seule fois.
            if command -v crontab &> /dev/null; then
              if ! crontab -l 2>/dev/null | grep -Fq "$CURRENT_DIR && php artisan schedule:run"; then
                ( crontab -l 2>/dev/null; echo "* * * * * cd $CURRENT_DIR && php artisan schedule:run >> /dev/null 2>&1" ) | crontab - \
                  && echo "⏰ Cron du planificateur installé"
              fi
            fi

            # ── WhatsApp Node : redémarrage ───────────────────────────────────
            if command -v supervisorctl &> /dev/null && sudo supervisorctl status whatsapp-node &> /dev/null; then
              echo "🔄 Restarting WhatsApp Node (supervisor)..."
              sudo supervisorctl restart whatsapp-node || true
            else
              echo "🔄 Restarting WhatsApp Node via Artisan..."
              kill $(own_pids "node dist/index.js") 2>/dev/null || true
              sleep 2
              # env() relu (cache vidé), démarrage forcé, sortie coupée de la
              # session SSH (sinon le déploiement reste bloqué), cache refait.
              php artisan config:clear
              WA_AUTO_START=true php artisan whatsapp:node:start > /dev/null 2>&1 || echo "⚠️  Erreur au démarrage de WhatsApp Node."
              php artisan config:cache
              sleep 4
              if [ -n "$(own_pids 'node dist/index.js')" ]; then
                echo "✅ WhatsApp Node en marche."
              else
                echo "❌ WhatsApp Node arrêté - dernières lignes du journal :"
                tail -n 30 storage/logs/whatsapp-node-error.log 2>/dev/null || true
              fi
            fi
            
            # Keep only last 5 releases
            echo "🧹 Cleaning old releases..."
            cd $DEPLOY_PATH/releases
            ls -t | tail -n +6 | xargs -r  rm -rf
            
            echo "✅ Deployment completed successfully!"
          ENDSSH

      - name: Deployment Status
        if: success()
        run: echo "🎉 Deployment to production completed successfully!"

      - name: Deployment Failed
        if: failure()
        run: echo "❌ Deployment failed. Please check the logs."
