name: 🚀 Deploy backend-modules (mirco-dev-secure)

on:
  push:
    branches:
      - mirco-dev-secure

jobs:
  deploy:
    name: Build & Deploy to Production
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔨 Build production
        run: npm run build
        env:
          NODE_ENV: production

      - name: 🚀 Deploy build via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            echo "📦 Préparation du répertoire de déploiement..."
            mkdir -p /var/www/progi-cap.the-haute-societyy.com
            echo "✅ Prêt pour la réception du build"

      - name: 📤 Upload build files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "dist/*"
          target: "/var/www/progi-cap.the-haute-societyy.com"
          strip_components: 1
          rm: true

      - name: ✅ Post-deploy verification
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            echo "✅ backend-modules (progi-cap) déployé !"
            ls -la /var/www/progi-cap.the-haute-societyy.com/ | head -10
