; Limites PHP-FPM pour les téléversements (lu automatiquement par PHP-FPM
; dans le dossier public/, prise en compte sous ~5 min).
;
; Bug corrigé : candidatures qui échouaient depuis un téléphone (photos de
; 2 à 12 Mo) mais pas depuis un PC (PDF légers). Avec les valeurs par défaut
; de PHP (2 Mo par fichier, 8 Mo par requête), un dossier envoyé en photos
; dépassait la limite et PHP vidait la requête avant même Laravel.
;
; Taille max par fichier côté application (contrôlée par Laravel, voir
; app/Support/UploadLimit.php) : 2 Mo ; rapports et mémoires 10 Mo ;
; supports de cours 20 Mo. PHP doit laisser passer la plus grande (+ marge).
; ⚠️ Nginx doit aussi l'autoriser : client_max_body_size 64M; dans le
; server{} du site, puis `sudo nginx -t && sudo systemctl reload nginx`.
upload_max_filesize = 21M
post_max_size = 64M
max_file_uploads = 30
max_execution_time = 120
max_input_time = 120
memory_limit = 256M
